<main>
  <app-checkout-steps [currentStep]="4"></app-checkout-steps>

  <div class="wrapper">
    <div class="pix-container" *ngIf="pix">
      <h2>Pagamento via PIX</h2>

      <img [src]="'data:image/png;base64,' + pix.qrCodeBase64" class="qr-code" />

      <p>{{ statusMsg }}</p>

      <div class="pix-info">
        <p><strong>Valor:</strong> R$ {{ pix.valor }}</p>
        <p><strong>Status:</strong> {{ pix.status }}</p>
      </div>

      <div class="pix-code">
        <p>{{ pix.qrCode }}</p>
      </div>

      <button (click)="copiarCodigo()">Copiar Código PIX</button>
    </div>
  </div>
</main>
