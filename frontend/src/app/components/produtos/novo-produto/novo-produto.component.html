<div class="wrapper">
    <div class="container">
        <div class="header">
            <button mat-icon-button (click)="onVoltar()"><mat-icon>arrow_back</mat-icon></button>

            <h2>Novo Produto</h2>
        </div>

        <form [formGroup]="formProduto" (ngSubmit)="onCadastrar()">
            <div class="form-row">
                <img width="245" (click)="fileInput.click()" class="image" [src]="imagePreview" alt="Image Preview" />
                <input (change)="onFileSelected($event)" name="img" #fileInput type="file" id="file"
                    style="height: min-content;">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <mat-form-field appearance="outline">
                        <mat-label>Nome:</mat-label>
                        <input matInput name="produto" type="text" formControlName="nome">
                    </mat-form-field>
                </div>

                <div class="form-group">
                    <mat-form-field appearance="outline">
                        <mat-label>Descrição:</mat-label>
                        <input matInput name="descricao" type="text" formControlName="descricao">
                    </mat-form-field>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <mat-form-field appearance="outline">
                        <mat-label for="categoria">Categoria:</mat-label>
                        <mat-select formControlName="categoria" (selectionChange)="getSubcategorias()">
                            <mat-option *ngFor="let categoria of categorias" value="{{categoria.id}}"
                                [hidden]="!categoria.ativo">{{categoria.nome}}</mat-option>
                        </mat-select>
                    </mat-form-field>
                    <mat-icon class="addBttn" (click)="addCategorias()">add</mat-icon>
                </div>

                <div class="form-group">
                    <mat-form-field appearance="outline">
                        <mat-label for="categoria">SubCategoria:</mat-label>
                        <mat-select formControlName="subcategoria">
                            <mat-option *ngFor="let subcategoria of subcategorias" value="{{subcategoria.id}}"
                                [hidden]="!subcategoria.ativo">{{subcategoria.nome}}</mat-option>
                        </mat-select>
                    </mat-form-field>
                    <mat-icon class="addBttn" (click)="addCategorias()">add</mat-icon>
                </div>


                <div class="form-group"></div>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <mat-form-field appearance="outline">
                        <mat-label>Valor de Custo:</mat-label>
                        <input matInput type="number" formControlName="valor_custo">
                    </mat-form-field>
                </div>

                <div class="form-group">
                    <mat-form-field appearance="outline">
                        <mat-label>Valor de Venda:</mat-label>
                        <input matInput type="number" formControlName="valor_venda">
                    </mat-form-field>
                </div>

                <div class="form-group">
                </div>
            </div>

            <!-- <div class="form-row">
                <div class="form-group">
                    <mat-form-field appearance="outline">
                        <mat-label>NCM:</mat-label>
                        <input readonly type="text" matInput formControlName="ncm">
                        <span style="margin-right: 30px; cursor: pointer;" matSuffix><mat-icon
                                (click)="searchNCM()">search</mat-icon></span>
                    </mat-form-field>
                </div>

                <div class="form-group">
                    <mat-form-field appearance="outline">
                        <mat-label>CEST:</mat-label>
                        <input matInput type="text" formControlName="cest">
                    </mat-form-field>
                </div>

                <div class="form-group">
                    <mat-form-field appearance="outline">
                        <mat-label>CFOP:</mat-label>
                        <input readonly type="text" matInput formControlName="cfop">
                        <span style="margin-right: 30px; cursor: pointer;" matSuffix><mat-icon
                                (click)="searchCFOP()">search</mat-icon></span>
                    </mat-form-field>
                </div>
            </div> -->

            <div class="form-row">
                <div class="form-group">
                    <mat-form-field appearance="outline">
                        <mat-label>Peso (kg):</mat-label>
                        <input type="text" matInput formControlName="peso" mask="separator.3" thousandSeparator="."
                            decimalMarker=",">
                    </mat-form-field>
                </div>
                <div class="form-group"></div>
                <div class="form-group"></div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <mat-form-field appearance="outline">
                        <mat-label>Altura (cm):</mat-label>
                        <input type="text" matInput formControlName="altura" mask="separator.2" thousandSeparator="."
                            decimalMarker=",">
                    </mat-form-field>
                </div>
                <div class="form-group">
                    <mat-form-field appearance="outline">
                        <mat-label>Largura (cm):</mat-label>
                        <input type="text" matInput formControlName="largura" mask="separator.2" thousandSeparator="."
                            decimalMarker=",">
                    </mat-form-field>
                </div>
                <div class="form-group">
                    <mat-form-field appearance="outline">
                        <mat-label>Comprimento (cm):</mat-label>
                        <input type="text" matInput formControlName="comprimento" mask="separator.2"
                            thousandSeparator="." decimalMarker=",">
                    </mat-form-field>
                </div>
            </div>

            <div class="buttons">
                <button class="action-bttn" type="submit" mat-button>Cadastrar</button>
            </div>
        </form>
    </div>

    <ng-template #search>
        <div class="dialog">
            <div class="filter">
                <mat-icon>search</mat-icon>
                <input (keyup)="applyFilter($event)" type="text" placeholder="Buscar...">
            </div>

            <div class="table">
                <table mat-table [dataSource]="dataSource  | searchFilter: searchText">
                    <ng-container matColumnDef="select">
                        <th mat-header-cell *matHeaderCellDef> </th>
                        <td mat-cell *matCellDef="let row" style="padding-inline: 24px;">
                            <mat-checkbox color="secondary" (click)="$event.stopPropagation()"
                                (change)="$event ? selection.toggle(row) : null" [checked]="selection.isSelected(row)">
                            </mat-checkbox>
                        </td>
                    </ng-container>

                    <ng-container *ngFor="let column of displayedColumns; let colIndex = index"
                        matColumnDef="{{column}}">
                        <th style="text-transform: capitalize;" mat-header-cell *matHeaderCellDef> {{column}} </th>
                        <td mat-cell *matCellDef="let element"> {{element[column]}} </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                    <tr style="cursor: pointer;" mat-row *matRowDef="let row; columns: displayedColumns;"
                        (click)="selection.toggle(row)" [class.checked]="selection.isSelected(row)"></tr>
                    <tr class="mat-row" id="no-data" *matNoDataRow>
                        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
                            Nenhum dado foi encontrado.
                        </td>
                    </tr>
                </table>
            </div>
            <div class="paginator">
                <mat-paginator [pageSizeOptions]="[50, 75, 100]">
                </mat-paginator>
            </div>

            <div class="dialog-button">
                <button mat-button (click)="onSelect()">Selecionar</button>
            </div>
        </div>
    </ng-template>
</div>
