<div class="produto" [class.esgotado]="esgotado" (click)="visualizarProduto()">
    <div class="image">
        <img [src]="produto.img || semImagem" [alt]="produto.nome" loading="lazy" (error)="onImagemErro($event)">
        @if (esgotado) {
            <span class="badge-esgotado">Esgotado</span>
        }
    </div>

    <div class="info">
        <div class="info-row">
            <p>{{produto.nome}}</p>
        </div>
        <div class="info-row">
            <p>{{produto.valor_venda | currency: 'BRL'}}</p>
            <button mat-icon-button [disabled]="esgotado" (click)="adicionarCarrinho(produto); $event.stopPropagation()">
                <mat-icon>shopping_bag</mat-icon>
            </button>
        </div>
    </div>
</div>
