<div class="wrapper">
    <div class="actions">
        <div class="filters">
            <div class="filter">
                <mat-icon>search</mat-icon>
                <input (keyup)="applyFilter($event)" type="text" placeholder="Buscar Categoria...">
            </div>
        </div>

        <div class="buttons">
            <button id="insert-bttn" mat-button (click)="onCreate()">Nova Categoria</button>

            <button id="actions-bttn" mat-button [matMenuTriggerFor]="menu">
                <p>Ações<mat-icon>expand_more</mat-icon></p>
            </button>

            <mat-menu #menu="matMenu">
                <button mat-menu-item [disabled]="this.selection.selected.length != 1" (click)="onEditar()">
                    <mat-icon>edit</mat-icon>
                    Editar Categoria
                </button>
                <button mat-menu-item [disabled]="this.selection.selected.length != 1" (click)="subcategorias()">
                    <mat-icon>filter_list</mat-icon>
                    SubCategorias
                </button>
            </mat-menu>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h3>Categorias</h3>
        </div>

        <div class="table">
            <table mat-table [dataSource]="dataSource | searchFilter: searchText" matSort>
                <ng-container matColumnDef="select">
                    <th mat-header-cell *matHeaderCellDef>
                        <!-- <mat-checkbox (change)="$event ? masterToggle() : null"
                        [checked]="selection.hasValue() && isAllSelected()"
                        [indeterminate]="selection.hasValue() && !isAllSelected()">
                    </mat-checkbox> -->
                    </th>
                    <td mat-cell *matCellDef="let row" style="padding-inline: 24px;">
                        <mat-checkbox color="secondary" (click)="$event.stopPropagation()"
                            (change)="$event ? selection.toggle(row) : null" [checked]="selection.isSelected(row)">
                        </mat-checkbox>
                    </td>
                </ng-container>

                <ng-container matColumnDef="nome">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Nome </th>
                    <td mat-cell *matCellDef="let categoria"> {{categoria.nome}} </td>
                </ng-container>

                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
                    <td mat-cell *matCellDef="let categoria"> {{categoria.status}} </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selection.toggle(row)"></tr>
                <tr class="mat-row" id="no-data" *matNoDataRow>
                    <td class="mat-cell" [attr.colspan]="displayedColumns.length">
                        Nenhum dado foi encontrado.
                    </td>
                </tr>
            </table>
        </div>

        <div class="paginator">
            <mat-paginator [pageSizeOptions]="[50, 75, 100]">
            </mat-paginator>
        </div>
    </div>
</div>
